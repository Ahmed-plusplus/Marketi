name: marketi
description: "E-commerce flutter demo app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_svg: ^2.0.10
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  get_it: ^9.2.1
  cached_network_image: ^4.0.0
  persistent_bottom_nav_bar: ^5.0.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
         - asset: assets/fonts/Poppins-Regular.ttf
